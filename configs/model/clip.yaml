# Configuration for OpenAI CLIP (Contrastive Language-Image Pre-training)
model:
  name: "clip"
  model_id: "openai/clip-vit-base-patch32"
  
  # CLIP ViT-B/32 standard embedding dimension is 512
  embedding_dim: 512 
  
  # Inference settings
  batch_size: 64
  device: "cuda" # or "cpu"

preprocessing:
  image_size: 224
  # Specific normalization for OpenAI CLIP
  mean: [0.48145466, 0.4578275, 0.40821073]
  std: [0.26862954, 0.26130258, 0.27577711]
  interpolation: "bicubic"

metadata:
  description: "Standard OpenAI CLIP model using ViT-B/32 architecture and Contrastive Loss."
  version: "1.0.0"